plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.openapi.generator" version "7.21.0"
}

group = 'ru.practicum'
version = '1.0.0'
description = 'my-market-app'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

openApiGenerate {
    generatorName.set("java")
    inputSpec.set("$rootDir/api-spec.yaml")
    outputDir.set("$projectDir/build/generated")
    ignoreFileOverride.set("$projectDir/.openapi-generator-ignore")
    modelPackage.set("ru.practicum.mymarketapp.entity")
    invokerPackage.set("ru.practicum.mymarketapp.service")
    apiPackage.set("ru.practicum.mymarketapp.service")
    configOptions.set([
            hideGenerationTimestamp: "true",
            library                : "webclient",
            useJakartaEe           : "true",
            useTags                : "true",
            openApiNullable        : "false",
            serializableModel      : "true"
    ])
}

sourceSets.main.java.srcDir "$projectDir/build/generated/src/main"


dependencies {
    implementation('org.springframework.boot:spring-boot-starter')
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation'org.springframework.boot:spring-boot-starter-webflux'
    implementation'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation'org.postgresql:r2dbc-postgresql:1.1.1.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation'org.postgresql:postgresql'
    implementation'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    //test
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testRuntimeOnly('io.r2dbc:r2dbc-h2')
    testRuntimeOnly('com.h2database:h2')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:r2dbc:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation("io.projectreactor:reactor-test")
    testImplementation("org.springframework.boot:spring-boot-webflux-test")
    testImplementation 'com.redis:testcontainers-redis:2.2.2'
    testImplementation 'com.github.codemonstur:embedded-redis:1.4.3'

//Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation('org.springframework.boot:spring-boot-starter-cache')
    implementation 'org.json:json:20231013'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.13'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.2'



}

tasks.named('test') {
    useJUnitPlatform()
}


bootJar {
    // имя и версия создаваемого архива
    archiveBaseName = 'api'
    archiveVersion = ''
}

tasks.named('compileJava') {
    dependsOn(tasks.openApiGenerate)
}