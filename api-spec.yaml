openapi: 3.0.2
info:
  title: Sample API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
  - url: https://api.example.com/v1
paths:
  /getBalance:
    get:
      summary: Получить баланс
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/Balance'
  /toPay:
    post:
      summary: Расплатится
      responses:
        '200':
          description: Операция выполнена успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
      requestBody:
        description: стоимость вещи
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quantity'

components:
  schemas:
    Balance:
      type: object
      properties:
        balance:
          type: string
          example: "500"
      required:
        - balance

    Quantity:
      type: object
      properties:
        quantity:
          type: string
          example: "200"
      required:
        - quantity