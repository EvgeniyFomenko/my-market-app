plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.openapi.generator" version "7.21.0"
}

group = 'ru.practicum'
version = '1.0.0'
description = 'pay-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}
sourceSets.main.java.srcDir "$projectDir/build/generated/src/main"

openApiGenerate {
    generatorName.set("spring")
    inputSpec.set("$rootDir/api-spec.yaml")
    outputDir.set("$projectDir/build/generated")
    modelPackage.set("ru.practicum.pay.server")
    apiPackage.set("ru.practicum.pay.server")
    ignoreFileOverride.set("$projectDir/.openapi-generator-ignore")
    configOptions.set([
            hideGenerationTimestamp: "true",
            requestMappingMode: "controller",
            interfaceOnly: "false",
            library: "spring-boot",
            reactive: "true",
            useSpringBoot3: "true",
            useJakartaEe: "true",
            useTags: "true",
            dateLibrary: "java8",
            openApiNullable: "false",
            serializableModel: "true",
            returnSuccessCode: "true"
    ])
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.13'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.2'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
//    implementation 'io.swagger.core.v3:swagger-annotations:2.2.28'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.json:json:20231013'
}

tasks.named('test') {
    useJUnitPlatform()
}


bootJar {
    // имя и версия создаваемого архива
    archiveBaseName = 'pay_service'
    archiveVersion = ''
}

tasks.named('compileJava') {
    dependsOn(tasks.openApiGenerate)
}

