plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.openapi.generator" version "7.12.0"
}

group = 'ru.practicum'
version = '0.0.1-SNAPSHOT'
description = 'pay_service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //OpenApi
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui'

    openApiGenerate {
        generatorName.set("spring")
        inputSpec.set("$projectDir/src/main/resources/api-spec.yaml")
        outputDir.set("$projectDir/build/generated")
        modelPackage.set("ru.practicum.pay.domain")
        apiPackage.set("ru.practicum.pay.api")
        invokerPackage.set("ru.practicum.pay.client")


        configOptions.set([
                sourceFolder: "src/gen/java/main/codegen",
                interfaceOnly: "false",
                library: "web-client",
                useJakartaEe: "true",
                useTags: "true",
                reactive: "true"
        ])
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


bootJar {
    // имя и версия создаваемого архива
    archiveBaseName = 'pay_service'
    archiveVersion = ''
}