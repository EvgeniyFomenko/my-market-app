plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.openapi.generator" version "7.12.0"
}

group = 'ru.practicum'
version = '0.0.1-SNAPSHOT'
description = 'my-market-app'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}





dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation'org.springframework.boot:spring-boot-starter-webflux'
    implementation'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation'org.postgresql:r2dbc-postgresql:1.1.1.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testRuntimeOnly('io.r2dbc:r2dbc-h2')
    testRuntimeOnly('com.h2database:h2')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:r2dbc:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation("io.projectreactor:reactor-test")
    testImplementation("org.springframework.boot:spring-boot-webflux-test")

    //Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    //OpenApi
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.13'

    openApiGenerate {
        generatorName.set("spring")
        inputSpec.set("$projectDir/src/main/resources/api-spec.yaml")
        outputDir.set("$projectDir/build/generated")
        modelPackage.set("ru.practicum.pay.domain")
        apiPackage.set("ru.practicum.pay.api")
        invokerPackage.set("ru.practicum.pay.client")


        configOptions.set([
                sourceFolder: "src/gen/java/main/codegen",
                interfaceOnly: "false",
                library: "web-client",
                useJakartaEe: "true",
                useTags: "true",
                reactive: "true"
        ])
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


bootJar {
    // имя и версия создаваемого архива
    archiveBaseName = 'api'
    archiveVersion = ''
}

